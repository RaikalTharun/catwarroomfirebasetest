<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAT 2026 — Prep War Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg:#f5f3ff; --bg2:#ffffff; --bg3:#f0edff; --bg4:#e9e4ff;
  --border:rgba(109,84,236,0.12); --border2:rgba(109,84,236,0.22);
  --text:#1a1035; --text2:#4a4466; --muted:#8b84a8; --muted2:#c4bfe0;
  --purple:#6d54ec; --purple-light:#ede9ff; --purple-mid:#b8a9f9;
  --orange:#ff6b35; --orange-light:#fff1ec;
  --teal:#0abf8a; --teal-light:#e6faf4;
  --pink:#e84393; --pink-light:#fff0f7;
  --blue:#1d87f0; --blue-light:#e8f4ff;
  --amber:#f5a623; --amber-light:#fff8eb;
  --red:#f03d3d; --red-light:#fff0f0;
  --green:#22c55e; --green-light:#f0fdf4;
  --shadow-sm:0 2px 8px rgba(109,84,236,0.08);
  --shadow-md:0 4px 20px rgba(109,84,236,0.12);
  --shadow-lg:0 8px 40px rgba(109,84,236,0.18);
  --r:14px; --r2:20px;
  --font-d:'Syne',sans-serif; --font-b:'Plus Jakarta Sans',sans-serif; --font-m:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:15px;line-height:1.6;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--purple-mid);border-radius:99px}

/* NAV — top bar with hamburger */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;height:62px;gap:12px}
.nav-brand{font-family:var(--font-d);font-weight:800;font-size:17px;letter-spacing:-0.5px;display:flex;align-items:center;gap:7px;color:var(--text);flex:1}
.nav-brand-badge{background:linear-gradient(135deg,var(--purple),#a855f7);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:0.5px}
.nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.cc{font-family:var(--font-m);font-size:11px;font-weight:500;background:linear-gradient(135deg,var(--purple),#a855f7);color:#fff;border-radius:99px;padding:6px 14px;box-shadow:0 2px 12px rgba(109,84,236,0.35);white-space:nowrap}
.hamburger-btn{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--border2);background:var(--bg3);color:var(--purple);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:all 0.2s;flex-shrink:0;touch-action:manipulation;padding:0}
.hamburger-btn:hover{background:var(--purple-light);border-color:var(--purple)}
.hamburger-btn span{display:block;width:18px;height:2px;background:var(--purple);border-radius:99px;transition:all 0.3s}
.hamburger-btn.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger-btn.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.hamburger-btn.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* SIDEBAR OVERLAY */
.sidebar-overlay{position:fixed;inset:0;background:rgba(22,16,58,0.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:300;display:none;opacity:0;transition:opacity 0.3s}
.sidebar-overlay.open{display:block;opacity:1}

/* SIDEBAR DRAWER */
.sidebar{position:fixed;top:0;left:-280px;width:275px;height:100vh;background:var(--bg2);z-index:400;box-shadow:4px 0 40px rgba(109,84,236,0.18);transition:left 0.3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
.sidebar.open{left:0}
.sidebar-header{padding:24px 20px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-logo{font-family:var(--font-d);font-weight:800;font-size:18px;letter-spacing:-0.5px;color:var(--text);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sidebar-cd{font-family:var(--font-m);font-size:11px;color:var(--muted);font-weight:500}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 10px}
.sidebar-nav::-webkit-scrollbar{width:3px}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--purple-light)}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all 0.18s;font-family:var(--font-b);margin-bottom:3px;touch-action:manipulation}
.sidebar-item:hover{background:var(--bg3)}
.sidebar-item.act{background:var(--purple-light);border:1px solid rgba(109,84,236,0.2)}
.sidebar-item .si-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg3);transition:all 0.18s;color:var(--muted)}
.sidebar-item.act .si-icon{background:var(--purple);box-shadow:0 3px 10px rgba(109,84,236,0.35);color:#fff}.sidebar-item:hover .si-icon{color:var(--purple)}
.sidebar-item .si-label{font-size:14px;font-weight:600;color:var(--muted);transition:color 0.18s}
.sidebar-item.act .si-label{color:var(--purple)}
.sidebar-item:hover .si-label{color:var(--text)}
.sidebar-item .si-badge{margin-left:auto;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:linear-gradient(135deg,var(--purple),#a855f7);color:#fff;display:none}
.sidebar-item.has-badge .si-badge{display:block}
.sidebar-divider{height:1px;background:var(--border);margin:8px 10px}
.sidebar-section-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);padding:8px 14px 4px}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--border);flex-shrink:0}
.sidebar-footer-text{font-size:12px;color:var(--muted);font-weight:500;text-align:center}
.sidebar-footer-text strong{color:var(--purple)}

/* Hide the old nav-pill */
.nav-pill{display:none}
.nav-tab{display:none}

/* BOTTOM NAV - mobile */
.mob-nav{display:none}
.mob-top-bar{display:none}
@media(max-width:640px){
  .nav{display:none}
  .mob-nav{display:none!important}
  .mob-top-bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,0.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:54px}
  .mob-top-title{font-family:var(--font-d);font-weight:800;font-size:16px;color:var(--text);display:flex;align-items:center;gap:6px}
  .mob-cc{font-family:var(--font-m);font-size:10px;font-weight:600;background:linear-gradient(135deg,var(--purple),#a855f7);color:#fff;border-radius:99px;padding:5px 11px;white-space:nowrap}
}

/* LAYOUT */
.main{padding:82px 28px 60px;max-width:1200px;margin:0 auto}
@media(max-width:640px){.main{padding:66px 14px 24px}}
.page-hdr{margin-bottom:32px}
.page-title{font-family:var(--font-d);font-weight:800;font-size:30px;letter-spacing:-0.8px;margin-bottom:4px}
.page-title span{background:linear-gradient(135deg,var(--purple),#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.page-sub{color:var(--muted);font-size:14px;font-weight:500}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:26px;box-shadow:var(--shadow-sm)}
.card-title{font-family:var(--font-d);font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:20px}

/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}}

/* STAT CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:720px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{border-radius:var(--r2);padding:22px;position:relative;overflow:hidden;border:1.5px solid transparent;transition:transform 0.2s,box-shadow 0.2s}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.sc-v{background:linear-gradient(145deg,#ede9ff,#e2daff);border-color:rgba(109,84,236,0.25)}
.sc-o{background:linear-gradient(145deg,#fff1ec,#ffe5d8);border-color:rgba(255,107,53,0.25)}
.sc-t{background:linear-gradient(145deg,#e6faf4,#d0f5e8);border-color:rgba(10,191,138,0.25)}
.sc-b{background:linear-gradient(145deg,#e8f4ff,#d4eaff);border-color:rgba(29,135,240,0.25)}
.stat-emoji{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.stat-label{font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:7px}
.stat-val{font-family:var(--font-d);font-size:32px;font-weight:800;line-height:1;letter-spacing:-1.5px}
.stat-frac{font-size:16px;font-weight:600;opacity:0.45}
.stat-sub{font-size:12px;margin-top:7px;opacity:0.65;font-weight:600}
.sc-v .stat-label,.sc-v .stat-val,.sc-v .stat-sub{color:var(--purple)}
.sc-o .stat-label,.sc-o .stat-val,.sc-o .stat-sub{color:#c44a1a}
.sc-t .stat-label,.sc-t .stat-val,.sc-t .stat-sub{color:#07825e}
.sc-b .stat-label,.sc-b .stat-val,.sc-b .stat-sub{color:#115da8}

/* PROGRESS */
.prog-wrap{background:var(--bg3);border-radius:99px;height:7px;overflow:hidden;margin:8px 0}
.prog-fill{height:100%;border-radius:99px;transition:width 0.6s cubic-bezier(.4,0,.2,1)}

/* BADGES */
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:0.4px;padding:3px 10px;border-radius:99px;text-transform:uppercase}
.bh{background:var(--amber-light);color:#9a6200;border:1px solid rgba(245,166,35,0.35)}
.bm{background:var(--teal-light);color:#07825e;border:1px solid rgba(10,191,138,0.28)}
.bl{background:var(--bg3);color:var(--muted);border:1px solid var(--border)}
.bk{background:var(--orange-light);color:#c44a1a;border:1px solid rgba(255,107,53,0.28)}
.bv{background:var(--purple-light);color:var(--purple);border:1px solid rgba(109,84,236,0.22)}
.bd{background:var(--orange-light);color:#c44a1a;border:1px solid rgba(255,107,53,0.22)}
.bq{background:var(--blue-light);color:#115da8;border:1px solid rgba(29,135,240,0.22)}
.bg_{background:var(--green-light);color:#166534;border:1px solid rgba(34,197,94,0.28)}

/* SECTION TABS */
.sec-pill-tabs{display:flex;background:var(--bg3);border-radius:99px;padding:5px;gap:3px;border:1px solid var(--border);width:fit-content;max-width:100%;margin-bottom:24px;overflow-x:auto}
.sec-pill-tabs::-webkit-scrollbar{display:none}
.sec-pill-tab{padding:10px 18px;font-family:var(--font-b);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;border-radius:99px;transition:all 0.2s;white-space:nowrap;-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-height:40px}
.sec-pill-tab:hover{color:var(--text)}
.sec-pill-tab.act{background:var(--bg2);color:var(--purple);box-shadow:var(--shadow-sm)}
@media(max-width:640px){
  .sec-pill-tabs{width:100%;border-radius:16px}
  .sec-pill-tab{flex:1;text-align:center;font-size:12px;padding:10px 8px}
}

/* MONTH TABS */
.month-tabs{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}
.month-tab{padding:9px 20px;font-family:var(--font-b);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border:1.5px solid var(--border2);background:var(--bg2);border-radius:99px;transition:all 0.2s;box-shadow:var(--shadow-sm)}
.month-tab:hover{border-color:var(--purple-mid);color:var(--purple)}
.month-tab.act{background:linear-gradient(135deg,var(--purple),#a855f7);color:#fff;border-color:transparent;box-shadow:0 4px 20px rgba(109,84,236,0.4)}

/* WEEK ACCORDION */
.week-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow 0.2s}
.week-card:hover{box-shadow:var(--shadow-md)}
.week-hdr{display:flex;align-items:center;gap:12px;padding:18px 24px;cursor:pointer;transition:background 0.15s;flex-wrap:wrap}
.week-hdr:hover{background:var(--bg)}
.week-num-pill{font-family:var(--font-m);font-size:11px;font-weight:500;padding:4px 12px;border-radius:99px;flex-shrink:0}
.week-theme{font-family:var(--font-d);font-size:15px;font-weight:700;flex:1;color:var(--text)}
.week-arr{background:var(--bg3);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);transition:transform 0.25s;flex-shrink:0;margin-left:auto}
.week-arr.open{transform:rotate(180deg)}
.week-body{display:none;padding:0 24px 24px;border-top:1px solid var(--border)}
.week-body.open{display:block}
.week-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin:20px 0}
@media(max-width:700px){.week-grid{grid-template-columns:1fr}}
.week-col-lbl{font-size:11px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.wi{display:flex;gap:8px;margin-bottom:9px;align-items:flex-start}
.dot{width:6px;height:6px;border-radius:2px;flex-shrink:0;margin-top:8px;transform:rotate(45deg)}
.dqa{background:var(--blue)} .dva{background:var(--purple)} .ddi{background:var(--orange)}
.wi span{font-size:13px;color:var(--text2);line-height:1.55}
.week-note{background:linear-gradient(135deg,#fffbf0,#fff8e6);border-left:3px solid var(--amber);border-radius:0 12px 12px 0;padding:12px 16px;font-size:13px;color:#7a5210;margin-top:10px;font-weight:500}
.mock-alert{background:linear-gradient(135deg,var(--orange-light),#fff5f0);border:1px solid rgba(255,107,53,0.3);border-radius:12px;padding:12px 16px;font-size:13px;color:#c44a1a;margin-top:14px;display:flex;gap:8px;align-items:center;font-weight:600}

/* TOPIC ITEMS */
.topic-item{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:14px;cursor:pointer;transition:all 0.15s;margin-bottom:4px;border:1.5px solid transparent;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.topic-item:hover{background:var(--bg);border-color:var(--border2)}
.topic-item.tdone{opacity:0.5}
.topic-cb{width:28px;height:28px;min-width:28px;border:2px solid var(--muted2);border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;margin-top:0;background:var(--bg2)}
.topic-cb.done{background:var(--teal);border-color:var(--teal);box-shadow:0 2px 10px rgba(10,191,138,0.4)}
.topic-info{flex:1;min-width:0}
.topic-name{font-size:14px;font-weight:600;margin-bottom:3px;color:var(--text);line-height:1.4}
.topic-name.done{text-decoration:line-through;color:var(--muted)}
.topic-note{font-size:12px;color:var(--muted);line-height:1.5}
.topic-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.topic-wt{font-family:var(--font-m);font-size:10px;color:var(--muted);background:var(--bg3);padding:2px 8px;border-radius:6px}

/* FORM */
.mock-form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:600px){.mock-form{grid-template-columns:1fr}}
.fl{display:flex;flex-direction:column;gap:7px}
.fl-label{font-size:11px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--muted)}
input,textarea,select{background:var(--bg);border:1.5px solid var(--border2);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--text);font-family:var(--font-b);outline:none;transition:border 0.2s,box-shadow 0.2s;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(109,84,236,0.12)}
input::placeholder,textarea::placeholder{color:var(--muted2)}
textarea{resize:vertical;min-height:64px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;font-family:var(--font-b);font-size:13px;font-weight:700;border:none;border-radius:99px;cursor:pointer;transition:all 0.2s}
.btn-p{background:linear-gradient(135deg,var(--purple),#a855f7);color:#fff;box-shadow:0 4px 18px rgba(109,84,236,0.38)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(109,84,236,0.48)}
.btn-g{background:var(--bg3);color:var(--purple);border:1.5px solid var(--border2)}
.btn-g:hover{background:var(--purple-light);border-color:var(--purple)}
.btn-green{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 4px 16px rgba(34,197,94,0.3)}
.btn-green:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(34,197,94,0.4)}
.btn-x{background:transparent;color:var(--muted);border:none;font-size:16px;cursor:pointer;padding:8px 10px;border-radius:8px;transition:all 0.15s;font-family:var(--font-b);min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn-x:hover{color:var(--red);background:var(--red-light)}

/* MOCK TABLE */
.mock-table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--border)}
.mock-table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.mock-table th{text-align:left;font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--border);background:var(--bg)}
.mock-table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.mock-table tr:last-child td{border-bottom:none}
.mock-table tbody tr:hover td{background:var(--bg)}
.mnr td{padding:4px 14px 12px;font-size:12px;color:var(--muted);font-style:italic;background:var(--bg)}

/* INSIGHTS */
.ins-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
@media(max-width:600px){.ins-grid{grid-template-columns:1fr}}
.ins-card{border-radius:var(--r);padding:20px;text-align:center;border:1.5px solid transparent}
.icv{background:linear-gradient(145deg,#ede9ff,#e2daff);border-color:rgba(109,84,236,0.2)}
.icd{background:linear-gradient(145deg,#fff1ec,#ffe5d8);border-color:rgba(255,107,53,0.2)}
.icq{background:linear-gradient(145deg,#e8f4ff,#d4eaff);border-color:rgba(29,135,240,0.2)}
.ins-val{font-family:var(--font-d);font-size:30px;font-weight:800;margin:7px 0;letter-spacing:-1px}
.ins-label{font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase}
.ins-sub{font-size:11px;margin-top:4px;font-family:var(--font-m)}

.bench{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;background:var(--bg3);border-radius:14px;font-size:12px;color:var(--muted);border:1px solid var(--border);font-family:var(--font-m);font-weight:500}
.bench strong{color:var(--purple)}

/* DASHBOARD helpers */
.spr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.spr-lbl{font-size:13px;font-weight:700;color:var(--text)}
.spr-meta{font-size:12px;color:var(--muted);font-family:var(--font-m);font-weight:500}
.qt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.qt-item{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;transition:all 0.15s}
.qt-item:hover{border-color:var(--border2);box-shadow:var(--shadow-sm)}
.qt-name{font-size:13px;font-weight:600;margin-bottom:3px;color:var(--text)}
